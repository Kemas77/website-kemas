<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konversi Suhu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Konversi Suhu</h1>
        <p class="subtitle">Celsius ke Fahrenheit, Reamur, dan Kelvin</p>

        <div class="card">
            <label for="celsius">Masukkan Suhu Celsius</label>
            <input type="number" id="celsius" placeholder="Contoh: 25">

            <button onclick="konversiSuhu()">Konversi</button>

            <div id="hasil">
                <p>Fahrenheit: -</p>
                <p>Reamur: -</p>
                <p>Kelvin: -</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
