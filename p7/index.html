<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nilai Mahasiswa</title>
</head>
<body>

<main>
    <h1>Kalkulator Nilai Mahasiswa</h1>

    <form id="formNilai">

        <label for="nama">Nama Mahasiswa</label>
        <input id="nama" type="text" value="Dina" required>

        <label for="tugas">Tugas</label>
        <input id="tugas" type="number" min="0" max="100" value="82" required>

        <label for="uts">UTS</label>
        <input id="uts" type="number" min="0" max="100" value="78" required>

        <label for="uas">UAS</label>
        <input id="uas" type="number" min="0" max="100" value="88" required>

        <button type="submit">Hitung Nilai</button>

    </form>

    <article id="hasil">
        <h2>Hasil Perhitungan</h2>
        <p>Klik tombol <strong>Hitung Nilai</strong> untuk melihat hasil.</p>
    </article>
</main>

<script src="script.js"></script>

</body>
</html>
